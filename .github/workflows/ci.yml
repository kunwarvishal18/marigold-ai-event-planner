# Runs lint, the build check, unit tests and browser tests (both builds) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the jsPDF CDN file matches the pinned SRI hash
        run: node scripts/verify-sri.mjs
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Lint, build check, unit and browser tests
        run: npm test
        env:
          MG_REPORT: e2e-report.json
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: ignore
