# Runs the dependency audit, formatting, lint and strict type checks, the jsPDF SRI check, a mutation spot-check,
# the build check, unit tests with coverage thresholds and browser tests (both builds, including
# axe-core accessibility scans) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies for high or critical advisories
        run: npm audit --audit-level=high
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Verify the jsPDF CDN file matches the pinned SRI hash
        run: node scripts/verify-sri.mjs
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Mutation spot-check (tests must catch deliberately broken rules)
        run: npm run test:mutation
      - name: Lint, type check, build check, unit tests with coverage, browser tests
        run: npm test
        env:
          MG_REPORT: e2e-report.json
      - name: Keep the browser test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: e2e-report.json
          if-no-files-found: ignore
